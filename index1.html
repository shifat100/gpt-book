                    } catch (e) { /* ignore */ }
                }
            }, [content]);

            return ( <
                div ref = { rootRef }
                className = "markdown-body"
                style = { { fontSize: `${fontSize}px` } }
                dangerouslySetInnerHTML = { { __html: html } }
                />
            );
        };

        // --- FLIPBOOK COMPONENT ---
        const FlipBook = ({ book, chapter, onNavigate, fontSize = 14 }) => {
            const [pages, setPages] = useState([]);
            const [currentPage, setCurrentPage] = useState(0);
            const [isFlipping, setIsFlipping] = useState(false);
            const [flipDirection, setFlipDirection] = useState(null);
            const containerRef = useRef();

            // Split content into pages
            useEffect(() => {
                if (!chapter || !chapter.content) {
                    setPages([]);
                    return;
                }

                const raw = chapter.content;

                // Split by heading level 2 or 3, or by page breaks
                let parts = raw.split(/(?=^## |^### |^---$)/m);
                // Filter out empty parts
                parts = parts.filter(p => p.trim().length > 0);

                // If no split, treat as single page
                if (parts.length === 0) {
                    parts = [raw];
                }

                // Further split long pages
                const finalPages = [];
                for (let p of parts) {
                    const lines = p.split('\n');
                    let current = '';
                    let lineCount = 0;
                    for (const line of lines) {
                        current += line + '\n';
                        lineCount++;
                        // Split if we have enough lines and we hit a paragraph break
                        if (lineCount > 15 && line.trim() === '') {
                            if (current.trim().length > 50) {
                                finalPages.push(current.trim());
                                current = '';
                                lineCount = 0;
                            }
                        }
                    }
                    if (current.trim().length > 0) {
                        finalPages.push(current.trim());
                    }
                }

                // If still only one page, split by paragraphs
                if (finalPages.length <= 1) {
                    const paras = raw.split(/\n\n+/);
                    const chunks = [];
                    let chunk = '';
                    for (const p of paras) {
                        if (chunk.length + p.length > 1200) {
                            if (chunk.trim()) chunks.push(chunk.trim());
                            chunk = p + '\n\n';
                        } else {
                            chunk += p + '\n\n';
                        }
                    }
                    if (chunk.trim()) chunks.push(chunk.trim());
                    if (chunks.length > 1) {
                        setPages(chunks);
                        return;
                    }
                }

                setPages(finalPages.length > 0 ? finalPages : [raw]);
                setCurrentPage(0);
            }, [chapter]);

            const totalPages = pages.length;

            const goToPage = useCallback((index) => {
                if (isFlipping) return;
                if (index < 0 || index >= totalPages) return;
                setCurrentPage(index);
            }, [totalPages, isFlipping]);

            const nextPage = useCallback(() => {
                if (isFlipping) return;
                if (currentPage < totalPages - 1) {
                    setFlipDirection('next');
                    setIsFlipping(true);
                    setTimeout(() => {
                        setCurrentPage(prev => prev + 1);
                        setIsFlipping(false);
                        setFlipDirection(null);
                    }, 550);
                }
            }, [currentPage, totalPages, isFlipping]);

            const prevPage = useCallback(() => {
                if (isFlipping) return;
                if (currentPage > 0) {
                    setFlipDirection('prev');
                    setIsFlipping(true);
                    setTimeout(() => {
                        setCurrentPage(prev => prev - 1);
                        setIsFlipping(false);
                        setFlipDirection(null);
                    }, 550);
                }
            }, [currentPage, isFlipping]);

            // Keyboard navigation
            useEffect(() => {
                const handler = (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault();
                        nextPage(); }
                    if (e.key === 'ArrowLeft') { e.preventDefault();
                        prevPage(); }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [nextPage, prevPage]);

            if (!chapter || totalPages === 0) {
                return ( <
                    div className = "flipbook-wrapper" >
                    <
                    div style = { { color: 'var(--text-light)', textAlign: 'center', padding: '40px' } } >
                    No content to display. <
                    /div> <
                    /div>
                );
            }

            // Build page stack for flip book
            // We show up to 3 pages: current, next, previous for smooth transitions
            const renderPages = () => {
                const result = [];
                const showPrev = currentPage > 0;
                const showNext = currentPage < totalPages - 1;

                // Previous page (left, not flipped)
                if (showPrev) {
                    result.push({
                        key: 'prev',
                        index: currentPage - 1,
                        content: pages[currentPage - 1],
                        isFlipped: false,
                        zIndex: 1,
                        className: 'prev-page'
                    });
                }

                // Current page (front)
                result.push({
                    key: 'current',
                    index: currentPage,
                    content: pages[currentPage],
                    isFlipped: false,
                    zIndex: 10,
                    className: 'current-page'
                });

                // Next page (behind current, shown when flipping)
                if (showNext) {
                    result.push({
                        key: 'next',
                        index: currentPage + 1,
                        content: pages[currentPage + 1],
                        isFlipped: false,
                        zIndex: 5,
                        className: 'next-page'
                    });
                }

                return result;
            };

            const pageItems = renderPages();

            return ( <
                    div className = "flipbook-wrapper" >
                    <
                    div className = "flipbook-container"
                    ref = { containerRef } >
                    <
                    div className = "spine-glow" > < /div>

                    {
                        pageItems.map((item, idx) => {
                            const isCurrent = item.className === 'current-page';
                            const isNext = item.className === 'next-page';
                            const isPrev = item.className === 'prev-page';

                            // Determine flip state
                            let isFlipped = false;
                            let zIdx = item.zIndex;

                            if (isFlipping) {
                                if (flipDirection === 'next') {
                                    if (isCurrent) isFlipped = true;
                                    if (isNext) zIdx = 15;
                                    if (isPrev) zIdx = 1;
                                } else if (flipDirection === 'prev') {
                                    if (isPrev) isFlipped = true;
                                    if (isCurrent) zIdx = 15;
                                    if (isNext) zIdx = 1;
                                }
                            }

                            // For the current page, if flipping next, it becomes the back of the flip
                            const isFlippingOut = isFlipping && flipDirection === 'next' && isCurrent;
                            const isFlippingIn = isFlipping && flipDirection === 'prev' && isPrev;

                            const slotClass = `page-slot ${isFlipped || isFlippingOut || isFlippingIn ? 'flipped' : ''} ${isCurrent ? 'active' : ''} ${isNext && isFlipping && flipDirection === 'next' ? 'active-right' : ''}`;

                            return ( <
                                    div key = { item.key }
                                    className = { slotClass }
                                    style = {
                                        {
                                            zIndex: zIdx,
                                            transform: (isFlipped || isFlippingOut || isFlippingIn) ? 'rotateY(-180deg)' : 'rotateY(0deg)',
                                            transition: isFlipping ? 'transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1)' : 'none',
                                            pointerEvents: isCurrent ? 'auto' : 'none',
                                        }
                                    } >
                                    <
                                    div className = "page-face page-face-front" >
                                    <
                                    div className = "page-content" >
                                    <
                                    MarkdownViewer content = { item.content }
                                    fontSize = { fontSize }
                                    /> <
                                    /div> <
                                    div className = "page-number" >
                                    { isCurrent ? `Page ${currentPage + 1} of ${totalPages}` :
                                        isPrev ? `Page ${currentPage}` :
                                        isNext ? `Page ${currentPage + 2}` : '' } <
                                    /div> <
                                    /div> <
                                    div className = "page-face page-face-back" >
                                    <
                                    div className = "page-content" >
                                    <
                                    MarkdownViewer content = { item.content }
                                    fontSize = { fontSize }
                                    /> <
                                    /div> <
                                    div className = "page-number" >
                                    { isCurrent ? `Page ${currentPage + 1} of ${totalPages}` :
                                        isPrev ? `Page ${currentPage}` :
                                        isNext ? `Page ${currentPage + 2}` : '' } <
                                    /div> <
                                    /div> <
                                    /div>
                                );
                            })
                    }

                    {/* Click areas for flipping */ } <
                    div className = "flip-controls" >
                    <
                    div className = "hit-area hit-left"
                    onClick = { prevPage } >
                    <
                    span className = "arrow" > ‹ < /span> <
                    /div> <
                    div className = "hit-area hit-right"
                    onClick = { nextPage } >
                    <
                    span className = "arrow" > › < /span> <
                    /div> <
                    /div>

                    <
                    div className = "flip-indicator" >
                    { currentPage + 1 }
                    /{ totalPages } <
                    /div> <
                    /div> <
                    /div>
                );
            };

            // --- APP ---
            function App() {
                const [books, setBooks] = useState(PHYSICS_BOOKS);
                const [activeBook, setActiveBook] = useState(null);
                const [activeChapter, setActiveChapter] = useState(null);
                const [viewMode, setViewMode] = useState('home');
                const [theme, setTheme] = useState('white');
                const [fontSize, setFontSize] = useState(14);
                const [loading, setLoading] = useState(false);
                const [toastMsg, setToastMsg] = useState('');
                const [showSearch, setShowSearch] = useState(false);
                const [searchQuery, setSearchQuery] = useState('');
                const [searchTab, setSearchTab] = useState('books');
                const [showPrintModal, setShowPrintModal] = useState(false);
                const [selectedChapters, setSelectedChapters] = useState([]);
                const [printContent, setPrintContent] = useState([]);

                // Routing
                useEffect(() => {
                    const handleRoute = () => {
                        const params = new URLSearchParams(window.location.search);
                        const bId = params.get('book');
                        const cId = params.get('chapter');
                        const hash = window.location.hash;

                        if (hash === '#search') { setShowSearch(true); return; }
                        setShowSearch(false);

                        if (bId) {
                            const book = books.find(b => b.id === bId);
                            if (book) {
                                setActiveBook(book);
                                if (cId) {
                                    const chap = book.chapters.find(c => c.id === cId);
                                    if (chap) {
                                        setActiveChapter(chap);
                                        setViewMode('read');
                                        return;
                                    }
                                }
                                setViewMode('index');
                                setActiveChapter(null);
                                return;
                            }
                        }
                        setViewMode('home');
                        setActiveBook(null);
                        setActiveChapter(null);
                    };

                    window.addEventListener('popstate', handleRoute);
                    handleRoute();
                    return () => window.removeEventListener('popstate', handleRoute);
                }, [books]);

                const navigateTo = (book, chapter) => {
                    const url = new URL(window.location);
                    if (!book) {
                        url.searchParams.delete('book');
                        url.searchParams.delete('chapter');
                    } else {
                        url.searchParams.set('book', book.id);
                        if (chapter) url.searchParams.set('chapter', chapter.id);
                        else url.searchParams.delete('chapter');
                    }
                    url.hash = '';
                    window.history.pushState({}, '', url);

                    if (!book) { setViewMode('home');
                        setActiveBook(null);
                        setActiveChapter(null); } else if (chapter) {
                        setActiveBook(book);
                        setActiveChapter(chapter);
                        setViewMode('read');
                    } else {
                        setActiveBook(book);
                        setActiveChapter(null);
                        setViewMode('index');
                    }
                };

                const openSearch = () => {
                    const url = new URL(window.location);
                    url.hash = 'search';
                    window.history.pushState({}, '', url);
                    setShowSearch(true);
                };

                const closeSearch = () => {
                    const url = new URL(window.location);
                    url.hash = '';
                    window.history.pushState({}, '', url);
                    setShowSearch(false);
                };

                const cycleTheme = () => {
                    setTheme(t => t === 'white' ? 'sepia' : t === 'sepia' ? 'black' : 'white');
                };

                const showToast = (msg) => { setToastMsg(msg);
                    setTimeout(() => setToastMsg(''), 2500); };

                const handleShare = async () => {
                    const url = window.location.href;
                    if (navigator.share) {
                        try { await navigator.share({ title: 'Physics FlipBook', url }); return; } catch (e) {}
                    }
                    try { await navigator.clipboard.writeText(url);
                        showToast('Link copied!'); } catch (e) { showToast('Could not copy'); }
                };

                // Search results
                const getSearchResults = () => {
                    if (!searchQuery.trim()) return [];
                    const q = searchQuery.toLowerCase();
                    if (searchTab === 'books') {
                        return books.filter(b => b.title.toLowerCase().includes(q) || b.chapters.some(c => c.title.toLowerCase()
                            .includes(q)));
                    } else if (searchTab === 'chapters') {
                        const results = [];
                        books.forEach(b => {
                            b.chapters.forEach(c => {
                                if (c.title.toLowerCase().includes(q)) {
                                    results.push({ ...c, bookTitle: b.title, bookId: b.id });
                                }
                            });
                        });
                        return results;
                    } else {
                        // Content search - simple text search in chapter content
                        const results = [];
                        books.forEach(b => {
                            b.chapters.forEach(c => {
                                if (c.content && c.content.toLowerCase().includes(q)) {
                                    const idx = c.content.toLowerCase().indexOf(q);
                                    const start = Math.max(0, idx - 50);
                                    const end = Math.min(c.content.length, idx + q.length + 60);
                                    const snippet = (start > 0 ? "..." : "") + c.content.substring(start, end) + (end < c
                                        .content.length ? "..." : "");
                                    results.push({ ...c, bookTitle: b.title, bookId: b.id, snippet });
                                }
                            });
                        });
                        return results;
                    }
                };

                const highlightText = (text, highlight) => {
                    if (!highlight.trim()) return text;
                    const parts = text.split(new RegExp(`(${highlight})`, 'gi'));
                    return parts.map((part, i) =>
                        part.toLowerCase() === highlight.toLowerCase() ?
                        < span key = { i }
                        className = "highlight" > { part } < /span> :
                            part
                    );
                };

                const handleResultClick = (result) => {
                    closeSearch();
                    setTimeout(() => {
                        const book = books.find(b => b.id === (result.bookId || result.id));
                        if (searchTab === 'books') {
                            navigateTo(book, null);
                        } else if (searchTab === 'chapters') {
                            const chap = book.chapters.find(c => c.id === result.id);
                            navigateTo(book, chap);
                        } else {
                            const chap = book.chapters.find(c => c.id === result.id);
                            navigateTo(book, chap);
                        }
                    }, 100);
                };

                // --- Views ---
                const HomeView = () => ( <
                        div className = "reader-area" >
                        <
                        div className = "book-sheet"
                        style = { { textAlign: 'center', display: 'flex', flexDirection: 'column', justifyContent: 'center',
                                minHeight: '60vh', paddingBottom: '50px' } } >
                        <
                        h1 style = { { fontSize: 'clamp(2.2rem, 5vw, 3.2rem)', color: 'var(--accent)', marginBottom: '4px',
                                fontWeight: '700' } } >
                        ⚛ Physics Library <
                        /h1> <
                        p style = { { fontStyle: 'italic', marginBottom: '40px', opacity: 0.7, fontSize: '1.1rem' } } >
                        Explore the laws of the universe <
                        /p>

                        <
                        div className = "book-grid" >
                        { books.map(b => ( <
                                div key = { b.id }
                                className = "book-card"
                                onClick = {
                                    () => navigateTo(b, null) } >
                                <
                                div style = { { fontSize: '2.4rem', marginBottom: '6px' } } > { b.icon } < /div> <
                                h3 style = { { marginTop: 0, fontSize: '1.2rem', marginBottom: '4px' } } > { b.title } <
                                /h3> <
                                p style = { { fontSize: '13px', opacity: 0.6, margin: 0 } } >
                                { b.chapters.length }
                                chapters <
                                /p> <
                                /div>
                            ))
                        } <
                        /div> <
                        /div> <
                        /div>
                    );

                const IndexView = () => ( <
                        div className = "reader-area" >
                        <
                        div className = "book-sheet" >
                        <
                        div style = { { textAlign: 'center', marginBottom: '30px' } } >
                        <
                        div style = { { fontSize: '2.4rem' } } > { activeBook.icon } < /div> <
                        h1 style = { { margin: '4px 0 0 0', fontSize: 'clamp(1.8rem, 4vw, 2.5rem)', lineHeight: '1.2' } } >
                        { activeBook.title } <
                        /h1> <
                        hr style = { { borderTop: '2px solid var(--border-color)', width: '50px', margin: '20px auto',
                                opacity: 0.4 } }
                        /> <
                        /div>

                        <
                        div >
                        { activeBook.chapters.map((chap, idx) => ( <
                                div key = { chap.id }
                                onClick = {
                                    () => navigateTo(activeBook, chap) }
                                style = { { padding: '16px 10px', borderBottom: '1px dashed rgba(0,0,0,0.08)',
                                        cursor: 'pointer', display: 'flex', justifyContent: 'space-between',
                                        fontSize: '17px', alignItems: 'center', transition: '0.2s' } }
                                onMouseEnter = { (e) => e.currentTarget.style.backgroundColor = 'rgba(0,0,0,0.02)' }
                                onMouseLeave = { (e) => e.currentTarget.style.backgroundColor = 'transparent' } >
                                <
                                span style = { { display: 'flex', alignItems: 'center', gap: '12px' } } >
                                <
                                span style = { { color: 'var(--accent)', fontWeight: 'bold', fontSize: '14px',
                                        minWidth: '24px' } } > { idx + 1 } < /span> <
                                span > { chap.title } < /span> <
                                /span> <
                                span className = "material-icons"
                                style = { { fontSize: '20px', opacity: 0.4 } } > chevron_right < /span> <
                                /div>
                            ))
                        } <
                        /div> <
                        /div> <
                        /div>
                    );

                const ReadView = () => ( <
                        div className = "flipbook-wrapper" >
                        <
                        FlipBook book = { activeBook }
                        chapter = { activeChapter }
                        fontSize = { fontSize }
                        /> <
                        /div>
                    );

                const SearchModal = () => ( <
                        div className = "modal-overlay"
                        onClick = {
                            (e) => { if (e.target.className === 'modal-overlay') closeSearch(); } } >
                        <
                        div className = "search-box" >
                        <
                        div className = "search-header" >
                        <
                        span className = "material-icons" > search < /span> <
                        input className = "search-input"
                        placeholder = "Search physics..."
                        value = { searchQuery }
                        onChange = { (e) => setSearchQuery(e.target.value) }
                        autoFocus = { true }
                        /> <
                        button className = "btn"
                        onClick = { closeSearch } >
                        <
                        span className = "material-icons" > close < /span> <
                        /button> <
                        /div> <
                        div className = "search-tabs" >
                        { ['books', 'chapters', 'content'].map(t => ( <
                                button key = { t }
                                className = { `tab-btn ${searchTab===t?'active':''}` }
                                onClick = {
                                    () => setSearchTab(t) } >
                                { t === 'books' ? 'Books' : t === 'chapters' ? 'Chapters' : 'Content' } <
                                /button>
                            ))
                        } <
                        /div> <
                        div className = "search-results" >
                        { searchQuery && getSearchResults().length === 0 && < div className = "empty-state" > No
                            results found < /div>} {
                                getSearchResults().map((item, idx) => ( <
                                    div key = { idx }
                                    className = "result-item"
                                    onClick = {
                                        () => handleResultClick(item) } >
                                    { searchTab === 'books' && ( <
                                        >
                                        <
                                        span className = "res-title" > { highlightText(item.title, searchQuery) } <
                                        /span> <
                                        span className = "res-sub" > { item.chapters.length }
                                        chapters < /span> <
                                        />
                                    ) }
                                    { (searchTab === 'chapters' || searchTab === 'content') && ( <
                                        >
                                        <
                                        span className = "res-title" > { highlightText(item.title, searchQuery) } <
                                        /span> <
                                        span className = "res-sub" > Book: { item.bookTitle } < /span> {
                                            searchTab === 'content' && item.snippet && < span className =
                                        "res-snippet" > { highlightText(item.snippet, searchQuery) } < /span>} <
                                        />
                                    ) } <
                                    /div>
                                ))
                            } <
                            /div> <
                            /div> <
                            /div>
                        );

                    // Print modal
                    const PrintModal = () => ( <
                        div className = "modal-overlay"
                        onClick = {
                            (e) => { if (e.target.className === 'modal-overlay') setShowPrintModal(false); } } >
                        <
                        div className = "modal-box" >
                        <
                        h3 style = { { marginTop: 0, borderBottom: '1px solid var(--border-color)',
                            paddingBottom: '10px' } } >
                        Select chapters to print <
                        /h3> <
                        div className = "chapter-list" >
                        <
                        label className = "checkbox-item"
                        style = { { fontWeight: 'bold', background: 'rgba(0,0,0,0.04)' } } >
                        <
                        input type = "checkbox"
                        onChange = {
                            () => setSelectedChapters(
                                selectedChapters.length === activeBook.chapters.length ?
                                [] :
                                activeBook.chapters.map(c => c.id)
                            )
                        }
                        checked = { selectedChapters.length === activeBook.chapters.length }
                        style = { { marginRight: '10px', transform: 'scale(1.2)' } }
                        /> Select all <
                        /label> {
                            activeBook.chapters.map(chap => ( <
                                label key = { chap.id }
                                className = "checkbox-item" >
                                <
                                input type = "checkbox"
                                checked = { selectedChapters.includes(chap.id) }
                                onChange = {
                                    () => setSelectedChapters(p =>
                                        p.includes(chap.id) ?
                                        p.filter(i => i !== chap.id) :
                                        [...p, chap.id]
                                    )
                                }
                                style = { { marginRight: '10px', transform: 'scale(1.2)' } }
                                /> { chap.title } <
                                /label>
                            ))
                        } <
                        /div> <
                        div style = { { display: 'flex', gap: '10px' } } >
                        <
                        button onClick = {
                            () => {
                                if (!selectedChapters.length) { showToast('Select at least one chapter'); return; }
                                setShowPrintModal(false);
                                setLoading(true);
                                const chaps = activeBook.chapters.filter(c => selectedChapters.includes(c.id));
                                setPrintContent(chaps.map(c => ({ title: c.title, content: c.content })));
                                setLoading(false);
                                setTimeout(() => window.print(), 400);
                            }
                        }
                        className = "action-btn" >
                        Print <
                        /button> <
                        button onClick = {
                            () => setShowPrintModal(false) }
                        className = "action-btn"
                        style = { { background: 'transparent', color: 'var(--text-main)',
                                border: '1px solid var(--text-main)' } } >
                        Cancel <
                        /button> <
                        /div> <
                        /div> <
                        /div>
                    );

                    // Print preview view
                    const PrintPreview = () => ( <
                        div className = "reader-area" >
                        <
                        div className = "book-sheet" >
                        <
                        div className = "no-print"
                        style = { { textAlign: 'center', marginBottom: '20px' } } >
                        <
                        button onClick = {
                            () => window.print() }
                        className = "action-btn"
                        style = { { width: 'auto', marginRight: '10px' } } >
                        Save as PDF <
                        /button> <
                        button onClick = {
                            () => { setViewMode('index');
                                setPrintContent([]); } }
                        className = "action-btn"
                        style = { { width: 'auto', background: '#666' } } >
                        Back <
                        /button> <
                        /div> {
                            printContent.map((c, i) => ( <
                                div key = { i }
                                style = { { pageBreakAfter: 'always', marginBottom: '30px' } } >
                                <
                                h2 style = { { color: 'var(--accent)' } } > { c.title } < /h2> <
                                MarkdownViewer content = { c.content }
                                fontSize = { 13 }
                                /> <
                                /div>
                            ))
                        } <
                        /div> <
                        /div>
                    );

                    // Apply theme
                    useEffect(() => {
                        document.body.className = `theme-${theme}`;
                        const meta = document.getElementById('theme-color');
                        if (meta) {
                            const colors = { white: '#e8e4de', sepia: '#d4c5a0', black: '#0d0d0d' };
                            meta.setAttribute('content', colors[theme] || '#e8e4de');
                        }
                    }, [theme]);

                    return ( <
                            div className = "app-container" >
                            <
                            div className = { `toast ${toastMsg ? 'show' : ''}` } > { toastMsg } < /div> {
                                loading && < div className = "loader" > Loading... < /div>}

                                { showSearch && < SearchModal / > } {
                                    showPrintModal && activeBook && < PrintModal / >
                                }

                                {
                                    viewMode === 'home' && < HomeView / >
                                } {
                                    viewMode === 'index' && activeBook && < IndexView / >
                                } {
                                    viewMode === 'read' && activeChapter && < ReadView / >
                                } {
                                    viewMode === 'print-preview' && < PrintPreview / >
                                }

                                <
                                div className = "controls no-print" >
                                <
                                button className = "btn"
                                onClick = {
                                    () => navigateTo(null) }
                                title = "Home" >
                                <
                                span className = "material-icons" > home < /span> <
                                /button> <
                                div className = "v-sep" > < /div> <
                                button className = "btn"
                                onClick = { openSearch }
                                title = "Search" >
                                <
                                span className = "material-icons"
                                style = { { color: 'var(--accent)' } } > search < /span> <
                                /button> <
                                div className = "v-sep" > < /div> {
                                    viewMode !== 'home' && ( <
                                        >
                                        <
                                        button className = "btn"
                                        onClick = { handleShare }
                                        title = "Share" >
                                        <
                                        span className = "material-icons"
                                        style = { { color: 'var(--accent)' } } > share < /span> <
                                        /button> <
                                        div className = "v-sep" > < /div> <
                                        />
                                    )
                                } {
                                    viewMode === 'read' && ( <
                                        >
                                        <
                                        button className = "btn"
                                        onClick = {
                                            () => navigateTo(activeBook, null) }
                                        title = "Index" >
                                        <
                                        span className = "material-icons" > list < /span> <
                                        /button> <
                                        div className = "v-sep" > < /div> <
                                        button className = "btn"
                                        onClick = {
                                            () => setFontSize(f => Math.max(f - 1, 10)) }
                                        title = "Smaller text" >
                                        <
                                        span className = "btn-text" > A- < /span> <
                                        /button> <
                                        button className = "btn"
                                        onClick = {
                                            () => setFontSize(f => Math.min(f + 1, 22)) }
                                        title = "Larger text" >
                                        <
                                        span className = "btn-text" > A+ < /span> <
                                        /button> <
                                        div className = "v-sep" > < /div> <
                                        />
                                    )
                                } {
                                    viewMode === 'index' && activeBook && ( <
                                        >
                                        <
                                        button className = "btn"
                                        onClick = {
                                            () => { setSelectedChapters([]);
                                                setShowPrintModal(true); } }
                                        title = "Print" >
                                        <
                                        span className = "material-icons" > picture_as_pdf < /span> <
                                        /button> <
                                        div className = "v-sep" > < /div> <
                                        />
                                    )
                                } <
                                button className = "btn"
                                onClick = { cycleTheme }
                                title = "Theme" >
                                <
                                span className = "material-icons" > {
                                    theme === 'white' ? 'brightness_5' :
                                        theme === 'sepia' ? 'menu_book' :
                                        'dark_mode'
                                } < /span> <
                                /button> <
                                /div> <
                                /div>
                            );
                        }

                        const root = ReactDOM.createRoot(document.getElementById('root'));
                        root.render( < App / > );
    </script>
</body>
</html>
