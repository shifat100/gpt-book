<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚛ Physics FlipBook Library</title>
    <meta name="theme-color" id="theme-color" content="#1a1a2e" />

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.13.11/dist/katex.min.css">

    <!-- React Libraries -->
    <script crossorigin src="react.development.js"></script>
    <script crossorigin src="react-dom.development.js"></script>
    <script src="babel.min.js"></script>
    <script src="marked.min.js"></script>

    <!-- KaTeX JS & Auto-Render -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.13.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.13.11/dist/contrib/auto-render.min.js"></script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        /* --- GLOBAL --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-body: #1a1a2e;
            --bg-paper: #faf6ef;
            --text-main: #2c2c2c;
            --text-light: #5a5a5a;
            --border-color: #c4b8a8;
            --accent: #c0392b;
            --accent-light: #e74c3c;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            --safe-bottom: 80px;
            --page-width: 420px;
            --page-height: 580px;
            --book-radius: 6px;
        }

        /* Themes */
        body.theme-white {
            --bg-body: #e8e4de;
            --bg-paper: #fcf8f0;
            --text-main: #2c2c2c;
            --text-light: #5a5a5a;
            --border-color: #c4b8a8;
            --accent: #c0392b;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        body.theme-sepia {
            --bg-body: #d4c5a0;
            --bg-paper: #f5efe0;
            --text-main: #4a3728;
            --text-light: #6b5a4a;
            --border-color: #b8a080;
            --accent: #8b5a2b;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }
        body.theme-black {
            --bg-body: #0d0d0d;
            --bg-paper: #1c1c1c;
            --text-main: #d4d4d4;
            --text-light: #999;
            --border-color: #444;
            --accent: #e67e22;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Crimson Text', serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-body);
        }

        /* --- FLIPBOOK --- */
        .flipbook-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: var(--bg-body);
            position: relative;
            overflow: hidden;
            perspective: 1800px;
        }

        .flipbook-container {
            position: relative;
            width: var(--page-width);
            max-width: 92vw;
            height: var(--page-height);
            max-height: 75vh;
            transform-style: preserve-3d;
            transition: transform 0.2s ease;
        }

        /* Book spine shadow */
        .flipbook-container::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 2%;
            width: 18px;
            height: 96%;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.25), transparent);
            border-radius: 4px 0 0 4px;
            pointer-events: none;
            z-index: 10;
        }

        .page-slot {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
            backface-visibility: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .page-slot.flipped {
            transform: rotateY(-180deg);
            pointer-events: none;
        }

        .page-slot.active {
            pointer-events: auto;
            z-index: 5;
        }
        .page-slot.active-right {
            pointer-events: auto;
            z-index: 5;
        }

        .page-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--book-radius);
            overflow: hidden;
            background: var(--bg-paper);
            box-shadow: var(--shadow);
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .page-face-front {
            z-index: 2;
            transform: rotateY(0deg);
        }
        .page-face-back {
            transform: rotateY(180deg);
            z-index: 1;
        }

        .page-slot.flipped .page-face-front {
            z-index: 1;
        }
        .page-slot.flipped .page-face-back {
            z-index: 2;
        }

        .page-content {
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-main);
            padding-right: 4px;
            scrollbar-width: thin;
        }
        .page-content::-webkit-scrollbar {
            width: 3px;
        }
        .page-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .page-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .page-content h1 {
            font-size: 1.4rem;
            text-align: center;
            margin: 0 0 8px 0;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .page-content h2 {
            font-size: 1.1rem;
            margin: 12px 0 6px 0;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }
        .page-content h3 {
            font-size: 0.95rem;
            margin: 10px 0 4px 0;
            font-weight: 600;
            color: var(--text-main);
        }
        .page-content p {
            margin: 0 0 8px 0;
            text-align: justify;
        }
        .page-content .katex {
            font-size: 1.05em;
        }

        .page-number {
            text-align: center;
            font-size: 11px;
            color: var(--text-light);
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            margin-top: 6px;
            font-family: 'Lato', sans-serif;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        /* --- FLIP CONTROLS --- */
        .flip-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        .flip-controls .hit-area {
            position: absolute;
            top: 0;
            width: 35%;
            height: 100%;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
            border-radius: var(--book-radius);
        }
        .flip-controls .hit-area:hover {
            background: rgba(0, 0, 0, 0.04);
        }
        .flip-controls .hit-area:active {
            background: rgba(0, 0, 0, 0.08);
        }
        .flip-controls .hit-left {
            left: 0;
        }
        .flip-controls .hit-right {
            right: 0;
        }
        .flip-controls .hit-area .arrow {
            font-size: 32px;
            color: var(--text-light);
            opacity: 0.2;
            transition: opacity 0.2s ease;
            pointer-events: none;
            user-select: none;
        }
        .flip-controls .hit-area:hover .arrow {
            opacity: 0.5;
        }
        .flip-controls .hit-area:active .arrow {
            opacity: 0.8;
        }

        .flip-indicator {
            position: absolute;
            bottom: -44px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            color: var(--text-light);
            background: rgba(0, 0, 0, 0.06);
            padding: 4px 18px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* --- BOOK COVER (special page) --- */
        .page-face.cover-page {
            background: linear-gradient(145deg, var(--accent), var(--accent-light));
            color: #fff;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: none;
            padding: 40px;
        }
        .page-face.cover-page .cover-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        .page-face.cover-page .cover-sub {
            font-size: 1rem;
            opacity: 0.85;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .page-face.cover-page .cover-deco {
            width: 60px;
            height: 2px;
            background: rgba(255, 255, 255, 0.4);
            margin: 12px auto;
        }
        .page-face.cover-page .cover-chap {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 12px;
            letter-spacing: 3px;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .flipbook-wrapper {
                padding: 8px;
            }
            :root {
                --page-width: 96vw;
                --page-height: 70vh;
            }
            .page-face {
                padding: 20px 16px;
            }
            .page-content {
                font-size: 12px;
            }
            .page-content h1 {
                font-size: 1.2rem;
            }
            .page-content h2 {
                font-size: 1rem;
            }
            .page-face.cover-page .cover-title {
                font-size: 1.6rem;
            }
            .flip-controls .hit-area {
                width: 30%;
            }
            .flip-controls .hit-area .arrow {
                font-size: 24px;
            }
        }

        @media (max-width: 400px) {
            .page-face {
                padding: 14px 12px;
            }
            .page-content {
                font-size: 11px;
                line-height: 1.5;
            }
            .page-content h1 {
                font-size: 1rem;
            }
            .page-content h2 {
                font-size: 0.9rem;
            }
            .page-face.cover-page .cover-title {
                font-size: 1.3rem;
            }
        }

        /* --- Other existing styles --- */
        .reader-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            background: var(--bg-body);
        }
        .book-sheet {
            background: var(--bg-paper);
            color: var(--text-main);
            width: 100%;
            max-width: 800px;
            min-height: 100%;
            height: fit-content;
            padding: 60px 50px;
            padding-bottom: var(--safe-bottom);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border-radius: 4px;
            position: relative;
        }
        @media (max-width: 768px) {
            .reader-area {
                padding: 0;
            }
            .book-sheet {
                max-width: 100%;
                padding: 30px 20px;
                padding-bottom: 120px;
                box-shadow: none;
                margin-bottom: 0;
                border-radius: 0;
            }
        }
        .markdown-body {
            line-height: 1.6;
        }
        .markdown-body h1 {
            text-align: center;
            color: var(--text-main);
            padding-bottom: 15px;
            margin-top: 0;
            text-transform: uppercase;
            font-weight: 700;
        }
        .markdown-body p {
            margin-bottom: 1.2em;
            text-align: justify;
        }
        .markdown-body img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px auto;
            border-radius: 4px;
        }
        .katex {
            font-size: 1.1em;
            color: var(--text-main);
        }
        .chapter-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            gap: 10px;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Crimson Text', serif;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
            flex: 1;
            justify-content: center;
        }
        .nav-btn:active {
            background: rgba(0, 0, 0, 0.1);
        }
        .nav-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
            border-style: dashed;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-paper);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 12px;
            z-index: 1000;
            border: 1px solid var(--border-color);
            align-items: center;
            max-width: 95%;
            overflow-x: auto;
        }
        .btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
            min-width: 44px;
            min-height: 44px;
        }
        .btn:hover {
            background: rgba(0, 0, 0, 0.08);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-text {
            font-weight: bold;
            font-family: sans-serif;
            font-size: 15px;
        }
        .v-sep {
            width: 1px;
            height: 24px;
            background: var(--text-main);
            opacity: 0.2;
            flex-shrink: 0;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 5000;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(10px);
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 10px;
        }
        .book-card {
            background: var(--bg-paper);
            padding: 25px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .book-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .search-box {
            background: var(--bg-paper);
            color: var(--text-main);
            width: 95%;
            max-width: 600px;
            height: 80vh;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .search-header {
            padding: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            background: transparent;
            color: var(--text-main);
            font-family: 'Lato', sans-serif;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .search-tabs {
            display: flex;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(0, 0, 0, 0.02);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-main);
            opacity: 0.6;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }
        .tab-btn.active {
            opacity: 1;
            border-bottom-color: var(--accent);
            background: rgba(0, 0, 0, 0.05);
        }
        .search-results {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        .result-item {
            padding: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: 0.2s;
        }
        .result-item:hover {
            background: rgba(0, 0, 0, 0.03);
        }
        .res-title {
            font-weight: bold;
            font-size: 16px;
            display: block;
            margin-bottom: 4px;
            color: var(--accent);
        }
        .res-sub {
            font-size: 13px;
            opacity: 0.7;
            display: block;
            margin-bottom: 6px;
        }
        .res-snippet {
            font-size: 14px;
            font-family: 'Crimson Text', serif;
            display: block;
            line-height: 1.4;
            color: var(--text-main);
        }
        .highlight {
            background-color: #ffeeba;
            padding: 0 2px;
            border-radius: 2px;
            font-weight: bold;
            color: #000;
        }
        .empty-state {
            padding: 40px;
            text-align: center;
            opacity: 0.6;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }
        .modal-box {
            background: var(--bg-paper);
            color: var(--text-main);
            width: 90%;
            max-width: 400px;
            max-height: 70vh;
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }
        .chapter-list {
            overflow-y: auto;
            flex: 1;
            margin: 15px 0;
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 5px;
            border-radius: 4px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            cursor: pointer;
        }
        .checkbox-item:hover {
            background: rgba(0, 0, 0, 0.03);
        }
        .action-btn {
            background: var(--text-main);
            color: var(--bg-paper);
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            font-weight: bold;
            margin-top: 5px;
        }

        @media print {
            .controls,
            .no-print,
            .chapter-nav,
            .flip-controls,
            .flip-indicator {
                display: none !important;
            }
            .flipbook-wrapper {
                padding: 0;
                overflow: visible;
            }
            .flipbook-container {
                max-height: none !important;
                height: auto !important;
                width: 100% !important;
                transform: none !important;
                perspective: none !important;
            }
            .page-slot {
                position: relative !important;
                transform: none !important;
                backface-visibility: visible !important;
                page-break-after: always;
                height: auto !important;
                min-height: 90vh;
                box-shadow: none !important;
                border: 1px solid #ccc !important;
                margin-bottom: 20px !important;
            }
            .page-face {
                position: relative !important;
                transform: none !important;
                backface-visibility: visible !important;
                box-shadow: none !important;
                border: none !important;
                padding: 30px !important;
                height: auto !important;
            }
            .page-face-back {
                display: none !important;
            }
            .page-slot.flipped .page-face-front {
                display: block !important;
            }
            .page-slot.flipped .page-face-back {
                display: none !important;
            }
            .page-number {
                display: none !important;
            }
        }

        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            z-index: 3000;
            font-family: sans-serif;
        }

        pre {
            background-color: rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-main);
        }
        code {
            background-color: rgba(0, 0, 0, 0.05);
            padding: 2px 4px;
            border-radius: 3px;
            font-family: inherit;
            color: var(--accent);
        }
        pre code {
            display: block;
            white-space: pre;
            word-wrap: normal;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 12px;
            font-family: 'Lato', sans-serif;
            overflow: hidden;
            border-radius: 4px;
        }
        table th {
            background-color: var(--accent);
            color: #fff;
            text-align: left;
            font-weight: bold;
            padding: 8px 12px;
            font-size: 0.8em;
            letter-spacing: 0.05em;
        }
        table td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }
        table tr:nth-of-type(even) {
            background-color: rgba(0, 0, 0, 0.02);
        }
        table tr:hover {
            background-color: rgba(0, 0, 0, 0.04);
        }
        body.theme-black table tr:nth-of-type(even) {
            background-color: rgba(255, 255, 255, 0.04);
        }

# Classical Mechanics

## The Foundation of Physics

Classical mechanics is the branch of physics that deals with the motion of bodies under the influence of forces. It forms the bedrock of all physical science, describing everything from the fall of an apple to the orbit of planets.

**Key concepts:**
- Space, time, and motion
- Mass and force
- Energy and momentum

The laws of classical mechanics were first formulated by **Isaac Newton** in his seminal work, *Philosophiæ Naturalis Principia Mathematica* (1687). These laws remained unchallenged for over two centuries until the advent of quantum mechanics and relativity.

---

## Newton's Laws of Motion

### First Law (Law of Inertia)

> A body remains at rest, or in uniform motion in a straight line, unless acted upon by a net external force.

This law introduces the concept of **inertia** — the tendency of an object to resist changes in its state of motion.

### Second Law (Law of Acceleration)

> The acceleration of a body is directly proportional to the net force acting on it, and inversely proportional to its mass.

$$ \\mathbf{F} = m\\mathbf{a} $$

This is arguably the most famous equation in physics. It tells us that force equals mass times acceleration.

### Third Law (Action-Reaction)

> For every action, there is an equal and opposite reaction.

When one body exerts a force on a second body, the second body simultaneously exerts a force equal in magnitude and opposite in direction on the first body.

---

## Kinematics

Kinematics describes motion without considering its causes.

### Displacement, Velocity, and Acceleration

**Displacement** \\( \\Delta \\mathbf{r} \\) is the change in position of an object.

**Velocity** is the rate of change of displacement:

$$ \\mathbf{v} = \\frac{d\\mathbf{r}}{dt} $$

**Acceleration** is the rate of change of velocity:

$$ \\mathbf{a} = \\frac{d\\mathbf{v}}{dt} = \\frac{d^2\\mathbf{r}}{dt^2} $$

### Equations of Motion (Constant Acceleration)

For motion with constant acceleration \\( a \\):

$$ v = u + at $$

$$ s = ut + \\frac{1}{2}at^2 $$

$$ v^2 = u^2 + 2as $$

where \\( u \\) is initial velocity, \\( v \\) is final velocity, \\( s \\) is displacement, and \\( t \\) is time.

---

## Work, Energy, and Power

### Work

Work is done when a force causes displacement:

$$ W = \\mathbf{F} \\cdot \\mathbf{d} = Fd\\cos\\theta $$

The unit of work is the **joule** (J).

### Kinetic Energy

The energy of motion:

$$ K = \\frac{1}{2}mv^2 $$

### Work-Energy Theorem

The net work done on an object equals its change in kinetic energy:

$$ W_{\\text{net}} = \\Delta K = \\frac{1}{2}mv^2 - \\frac{1}{2}mu^2 $$

### Potential Energy

Energy stored in a system due to position or configuration.

**Gravitational potential energy** near Earth's surface:

$$ U = mgh $$

**Elastic potential energy** (spring):

$$ U = \\frac{1}{2}kx^2 $$

### Conservation of Mechanical Energy

In the absence of non-conservative forces:

$$ K_i + U_i = K_f + U_f $$

---

## Momentum and Collisions

### Linear Momentum

$$ \\mathbf{p} = m\\mathbf{v} $$

### Impulse

$$ \\mathbf{J} = \\mathbf{F}\\Delta t = \\Delta\\mathbf{p} $$

### Conservation of Momentum

For an isolated system:

$$ \\mathbf{p}_{\\text{total, initial}} = \\mathbf{p}_{\\text{total, final}} $$

### Elastic and Inelastic Collisions

In an **elastic collision**, both momentum and kinetic energy are conserved.

In an **inelastic collision**, momentum is conserved but kinetic energy is not.

---

## Summary

Classical mechanics provides a complete description of motion for macroscopic objects at everyday speeds. Its principles are essential for understanding engineering, astronomy, and countless other fields.
                `

# Rotational Motion

## Angular Quantities

Just as linear motion uses displacement, velocity, and acceleration, rotational motion uses angular analogues:

**Angular displacement** \\( \\theta \\) (radians)

**Angular velocity** \\( \\omega \\):

$$ \\omega = \\frac{d\\theta}{dt} $$

**Angular acceleration** \\( \\alpha \\):

$$ \\alpha = \\frac{d\\omega}{dt} = \\frac{d^2\\theta}{dt^2} $$

---

## Rotational Kinematics

For constant angular acceleration:

$$ \\omega = \\omega_0 + \\alpha t $$

$$ \\theta = \\omega_0 t + \\frac{1}{2}\\alpha t^2 $$

$$ \\omega^2 = \\omega_0^2 + 2\\alpha\\theta $$

---

## Torque

Torque is the rotational analogue of force:

$$ \\tau = rF\\sin\\phi $$

where \\( r \\) is the distance from the axis of rotation, and \\( \\phi \\) is the angle between \\( \\mathbf{r} \\) and \\( \\mathbf{F} \\).

---

## Moment of Inertia

The moment of inertia \\( I \\) is the rotational analogue of mass:

$$ I = \\sum m_i r_i^2 $$

For a continuous body:

$$ I = \\int r^2 \\, dm $$

### Common Moments of Inertia

| Shape | Axis | \\( I \\) |
|-------|------|----------|
| Hoop | Through center | \\( MR^2 \\) |
| Disk | Through center | \\( \\frac{1}{2}MR^2 \\) |
| Solid sphere | Through center | \\( \\frac{2}{5}MR^2 \\) |
| Thin rod | Through center | \\( \\frac{1}{12}ML^2 \\) |
| Thin rod | Through end | \\( \\frac{1}{3}ML^2 \\) |

---

## Rotational Dynamics

The rotational analogue of Newton's second law:

$$ \\tau_{\\text{net}} = I\\alpha $$

---

## Angular Momentum

$$ \\mathbf{L} = \\mathbf{r} \\times \\mathbf{p} = I\\boldsymbol{\\omega} $$

### Conservation of Angular Momentum

For an isolated system:

$$ \\mathbf{L}_{\\text{initial}} = \\mathbf{L}_{\\text{final}} $$

This principle explains why a spinning ice skater speeds up when pulling in their arms — decreasing \\( I \\) increases \\( \\omega \\) to keep \\( L \\) constant.

---

## Rotational Kinetic Energy

$$ K_{\\text{rot}} = \\frac{1}{2}I\\omega^2 $$

For a rolling object, total kinetic energy is the sum of translational and rotational:

$$ K = \\frac{1}{2}Mv_{\\text{cm}}^2 + \\frac{1}{2}I\\omega^2 $$

---

## Summary

Rotational motion is described by angular position, velocity, and acceleration. Torque, moment of inertia, and angular momentum are the rotational analogues of force, mass, and linear momentum. The conservation of angular momentum is a powerful principle in physics.

# Gravitation

## Newton's Law of Universal Gravitation

Every particle of matter in the universe attracts every other particle with a force that is directly proportional to the product of their masses and inversely proportional to the square of the distance between them:

$$ F = G\\frac{m_1 m_2}{r^2} $$

where \\( G = 6.674 \\times 10^{-11} \\, \\text{N} \\cdot \\text{m}^2 / \\text{kg}^2 \\) is the gravitational constant.

---

## Gravitational Field

The gravitational field \\( \\mathbf{g} \\) at a point in space is the gravitational force per unit mass:

$$ \\mathbf{g} = -\\frac{GM}{r^2}\\hat{\\mathbf{r}} $$

Near Earth's surface, \\( g \\approx 9.8 \\, \\text{m/s}^2 \\).

---

## Gravitational Potential Energy

For two masses separated by distance \\( r \\):

$$ U = -\\frac{Gm_1 m_2}{r} $$

The potential energy is negative, approaching zero as \\( r \\to \\infty \\).

---

## Kepler's Laws of Planetary Motion

### First Law (Law of Ellipses)

The orbit of every planet is an ellipse with the Sun at one focus.

### Second Law (Law of Equal Areas)

A line joining a planet and the Sun sweeps out equal areas during equal intervals of time.

### Third Law (Law of Harmonies)

The square of the orbital period of a planet is proportional to the cube of the semi-major axis of its orbit:

$$ T^2 \\propto a^3 $$

For circular orbits around the Sun:

$$ T^2 = \\frac{4\\pi^2}{GM_{\\text{Sun}}} a^3 $$

---

## Gravitational Field of a Spherical Shell

### Shell Theorem (Newton)

1. A spherically symmetric shell of mass exerts no net gravitational force on a particle inside it.

2. The shell exerts a force on a particle outside it as if all the mass were concentrated at the center.

---

## Escape Speed

The minimum speed needed to escape the gravitational field of a body:

$$ v_{\\text{esc}} = \\sqrt{\\frac{2GM}{R}} $$

For Earth: \\( v_{\\text{esc}} \\approx 11.2 \\, \\text{km/s} \\)

---

## Summary

Gravitation is the fundamental force that governs the motion of celestial bodies. Newton's law of universal gravitation, combined with his laws of motion, explains planetary orbits, tides, and countless other phenomena.

# Electrostatics

## Electric Charge

Electric charge is a fundamental property of matter. There are two types: positive and negative. Like charges repel, unlike charges attract.

**Quantization of charge:** Charge comes in discrete units of \\( e = 1.602 \\times 10^{-19} \\, \\text{C} \\).

**Conservation of charge:** The total charge in an isolated system is conserved.

---

## Coulomb's Law

The force between two point charges is given by:

$$ F = k_e \\frac{|q_1 q_2|}{r^2} $$

where \\( k_e = 8.988 \\times 10^9 \\, \\text{N} \\cdot \\text{m}^2 / \\text{C}^2 \\) is Coulomb's constant.

In vector form:

$$ \\mathbf{F}_{12} = k_e \\frac{q_1 q_2}{r^2} \\hat{\\mathbf{r}}_{12} $$

---

## Electric Field

The electric field \\( \\mathbf{E} \\) at a point is the force per unit charge:

$$ \\mathbf{E} = \\frac{\\mathbf{F}}{q} $$

For a point charge \\( Q \\):

$$ \\mathbf{E} = k_e \\frac{Q}{r^2} \\hat{\\mathbf{r}} $$

---

## Electric Field Lines

Electric field lines are a visual representation of the electric field:
- They point away from positive charges and toward negative charges.
- The density of lines indicates the field strength.
- They never cross.

---

## Electric Potential

The electric potential \\( V \\) is the electric potential energy per unit charge:

$$ V = \\frac{U}{q} $$

For a point charge:

$$ V = k_e \\frac{Q}{r} $$

### Potential Difference

$$ \\Delta V = -\\int \\mathbf{E} \\cdot d\\mathbf{s} $$

---

## Conductors and Insulators

**Conductors** allow charge to flow freely (e.g., metals).

**Insulators** do not allow charge to flow freely (e.g., rubber, glass).

In electrostatic equilibrium, the electric field inside a conductor is zero, and the electric potential is constant throughout.

---

## Gauss's Law

Gauss's law relates the electric flux through a closed surface to the enclosed charge:

$$ \\oint \\mathbf{E} \\cdot d\\mathbf{A} = \\frac{Q_{\\text{enc}}}{\\varepsilon_0} $$

where \\( \\varepsilon_0 = 8.854 \\times 10^{-12} \\, \\text{C}^2 / (\\text{N} \\cdot \\text{m}^2) \\) is the permittivity of free space.

### Applications of Gauss's Law

| Configuration | Electric Field |
|---------------|----------------|
| Point charge | \\( E = \\frac{1}{4\\pi\\varepsilon_0} \\frac{Q}{r^2} \\) |
| Infinite line | \\( E = \\frac{\\lambda}{2\\pi\\varepsilon_0 r} \\) |
| Infinite sheet | \\( E = \\frac{\\sigma}{2\\varepsilon_0} \\) |
| Spherical shell (outside) | \\( E = \\frac{1}{4\\pi\\varepsilon_0} \\frac{Q}{r^2} \\) |
| Spherical shell (inside) | \\( E = 0 \\) |

---

## Capacitance

Capacitance is the ability of a system to store charge:

$$ C = \\frac{Q}{V} $$

The SI unit is the farad (F).

### Parallel Plate Capacitor

$$ C = \\frac{\\varepsilon_0 A}{d} $$

where \\( A \\) is the plate area and \\( d \\) is the separation.

### Energy Stored in a Capacitor

$$ U = \\frac{1}{2}CV^2 = \\frac{Q^2}{2C} $$

---

## Summary

Electrostatics describes the behavior of stationary electric charges. Coulomb's law governs the force between charges, and Gauss's law provides a powerful tool for calculating electric fields in symmetric situations.

# Electric Circuits

## Electric Current

Electric current is the rate of flow of charge:

$$ I = \\frac{dQ}{dt} $$

The SI unit is the ampere (A).

---

## Ohm's Law

For many materials, the current is proportional to the applied voltage:

$$ V = IR $$

where \\( R \\) is the resistance (ohms, \\( \\Omega \\)).

### Resistance and Resistivity

$$ R = \\rho \\frac{L}{A} $$

where \\( \\rho \\) is the resistivity, \\( L \\) is the length, and \\( A \\) is the cross-sectional area.

---

## Electrical Power

The power dissipated in a resistor:

$$ P = IV = I^2R = \\frac{V^2}{R} $$

---

## Resistors in Series and Parallel

### Series

$$ R_{\\text{eq}} = R_1 + R_2 + R_3 + \\cdots $$

Current is the same through all resistors.

### Parallel

$$ \\frac{1}{R_{\\text{eq}}} = \\frac{1}{R_1} + \\frac{1}{R_2} + \\frac{1}{R_3} + \\cdots $$

Voltage is the same across all resistors.

---

## Kirchhoff's Laws

### Junction Rule (Current Law)

The sum of currents entering a junction equals the sum of currents leaving:

$$ \\sum I_{\\text{in}} = \\sum I_{\\text{out}} $$

### Loop Rule (Voltage Law)

The sum of the potential differences around any closed loop is zero:

$$ \\sum \\Delta V = 0 $$

---

## RC Circuits

A circuit containing a resistor and capacitor.

### Charging a Capacitor

$$ q(t) = Q_{\\text{max}}(1 - e^{-t/RC}) $$

$$ I(t) = \\frac{\\mathcal{E}}{R} e^{-t/RC} $$

### Discharging a Capacitor

$$ q(t) = Q_0 e^{-t/RC} $$

$$ I(t) = -\\frac{Q_0}{RC} e^{-t/RC} $$

The time constant is \\( \\tau = RC \\).

---

## Summary

Electric circuits are the foundation of modern electronics. Ohm's law relates voltage, current, and resistance. Kirchhoff's laws provide a systematic method for analyzing complex circuits.
                `

# Magnetism

## Magnetic Fields

Moving charges produce magnetic fields. A magnetic field \\( \\mathbf{B} \\) exerts a force on a moving charge:

$$ \\mathbf{F} = q\\mathbf{v} \\times \\mathbf{B} $$

The magnitude of the force:

$$ F = qvB\\sin\\theta $$

---

## Magnetic Force on a Current-Carrying Wire

$$ \\mathbf{F} = I\\mathbf{L} \\times \\mathbf{B} $$

---

## Biot-Savart Law

The magnetic field produced by a current element:

$$ d\\mathbf{B} = \\frac{\\mu_0}{4\\pi} \\frac{I \\, d\\mathbf{l} \\times \\hat{\\mathbf{r}}}{r^2} $$

where \\( \\mu_0 = 4\\pi \\times 10^{-7} \\, \\text{T} \\cdot \\text{m} / \\text{A} \\) is the permeability of free space.

### Magnetic Field of a Long Straight Wire

$$ B = \\frac{\\mu_0 I}{2\\pi r} $$

### Magnetic Field at the Center of a Circular Loop

$$ B = \\frac{\\mu_0 I}{2R} $$

### Magnetic Field of a Solenoid

$$ B = \\mu_0 n I $$

where \\( n \\) is the number of turns per unit length.

---

## Ampère's Law

The line integral of the magnetic field around a closed loop is proportional to the enclosed current:

$$ \\oint \\mathbf{B} \\cdot d\\mathbf{l} = \\mu_0 I_{\\text{enc}} $$

---

## Faraday's Law of Induction

A changing magnetic flux induces an electromotive force (EMF):

$$ \\mathcal{E} = -\\frac{d\\Phi_B}{dt} $$

where \\( \\Phi_B = \\int \\mathbf{B} \\cdot d\\mathbf{A} \\) is the magnetic flux.

---

## Lenz's Law

The induced current flows in a direction that opposes the change that produced it.

---

## Inductance

### Self-Inductance

$$ \\mathcal{E} = -L\\frac{dI}{dt} $$

$$ L = \\frac{N\\Phi_B}{I} $$

### Inductance of a Solenoid

$$ L = \\mu_0 n^2 A l = \\mu_0 N^2 \\frac{A}{l} $$

### Energy Stored in an Inductor

$$ U = \\frac{1}{2}LI^2 $$

---

## RL Circuits

A circuit containing a resistor and inductor.

### Current Growth

$$ I(t) = \\frac{\\mathcal{E}}{R}(1 - e^{-t/\\tau}) $$

where \\( \\tau = L/R \\) is the time constant.

### Current Decay

$$ I(t) = I_0 e^{-t/\\tau} $$

---

## Summary

Magnetism is intimately connected to electricity through the laws of Biot-Savart, Ampère, and Faraday. These laws describe how currents produce magnetic fields and how changing magnetic fields induce currents.

# Quantum Mechanics

## The Birth of Quantum Theory

By the late 19th century, classical physics had reached its zenith. However, several phenomena could not be explained:

1. **Blackbody radiation** — the ultraviolet catastrophe
2. **The photoelectric effect** — light's particle nature
3. **Atomic spectra** — discrete emission lines

These puzzles led to the development of quantum mechanics.

---

## Planck's Hypothesis

Max Planck proposed that energy is emitted in discrete packets or "quanta":

$$ E = hf $$

where \\( h = 6.626 \\times 10^{-34} \\, \\text{J} \\cdot \\text{s} \\) is Planck's constant.

---

## Photoelectric Effect

Albert Einstein explained the photoelectric effect using the photon concept:

$$ E_{\\text{photon}} = hf = \\phi + K_{\\text{max}} $$

where \\( \\phi \\) is the work function and \\( K_{\\text{max}} \\) is the maximum kinetic energy of emitted electrons.

---

## Wave-Particle Duality

### de Broglie Hypothesis

Particles have wave-like properties:

$$ \\lambda = \\frac{h}{p} = \\frac{h}{mv} $$

### Electron Diffraction

The wave nature of electrons was confirmed by electron diffraction experiments (Davisson-Germer experiment).

---

## Heisenberg Uncertainty Principle

It is impossible to simultaneously know both the position and momentum of a particle with unlimited precision:

$$ \\Delta x \\, \\Delta p_x \\geq \\frac{\\hbar}{2} $$

where \\( \\hbar = h/2\\pi \\).

Also, for energy and time:

$$ \\Delta E \\, \\Delta t \\geq \\frac{\\hbar}{2} $$

---

## Schrödinger Equation

The time-dependent Schrödinger equation:

$$ i\\hbar\\frac{\\partial\\Psi}{\\partial t} = -\\frac{\\hbar^2}{2m}\\frac{\\partial^2\\Psi}{\\partial x^2} + V\\Psi $$

The time-independent Schrödinger equation:

$$ -\\frac{\\hbar^2}{2m}\\frac{d^2\\psi}{dx^2} + V\\psi = E\\psi $$

### The Wavefunction

The wavefunction \\( \\Psi(x,t) \\) contains all the information about a quantum system.

The probability density is:

$$ P(x,t) = |\\Psi(x,t)|^2 $$

The wavefunction must be normalized:

$$ \\int_{-\\infty}^{\\infty} |\\Psi|^2 \\, dx = 1 $$

---

## Particle in a Box

For a particle confined to a 1D box of length \\( L \\):

$$ E_n = \\frac{n^2 h^2}{8mL^2}, \\quad n = 1, 2, 3, \\ldots $$

$$ \\psi_n(x) = \\sqrt{\\frac{2}{L}} \\sin\\left(\\frac{n\\pi x}{L}\\right) $$

---

## Quantum Harmonic Oscillator

$$ E_n = \\left(n + \\frac{1}{2}\\right)\\hbar\\omega, \\quad n = 0, 1, 2, \\ldots $$

The ground state energy is \\( E_0 = \\frac{1}{2}\\hbar\\omega \\), known as zero-point energy.

---

## Summary

Quantum mechanics is the fundamental theory of the microscopic world. It introduces wave-particle duality, the uncertainty principle, and the wavefunction as the central object of description.

# Special Relativity

## The Postulates of Special Relativity

Albert Einstein's theory of special relativity is based on two postulates:

1. **The Principle of Relativity:** The laws of physics are the same in all inertial reference frames.

2. **The Invariance of the Speed of Light:** The speed of light in vacuum is the same for all observers, regardless of the motion of the light source or observer.

---

## Lorentz Transformations

The Lorentz transformations relate coordinates between two inertial frames moving at relative velocity \\( v \\):

$$ x' = \\gamma(x - vt) $$

$$ t' = \\gamma\\left(t - \\frac{vx}{c^2}\\right) $$

where \\( \\gamma = \\frac{1}{\\sqrt{1 - v^2/c^2}} \\) is the Lorentz factor.

---

## Time Dilation

Moving clocks run slower:

$$ \\Delta t = \\gamma \\Delta t_0 $$

where \\( \\Delta t_0 \\) is the proper time (time measured in the rest frame).

---

## Length Contraction

Moving objects are contracted along the direction of motion:

$$ L = \\frac{L_0}{\\gamma} $$

where \\( L_0 \\) is the proper length.

---

## Relativistic Velocity Addition

$$ u' = \\frac{u - v}{1 - uv/c^2} $$

---

## Relativistic Momentum and Energy

### Momentum

$$ \\mathbf{p} = \\gamma m\\mathbf{v} $$

### Total Energy

$$ E = \\gamma mc^2 $$

### Rest Energy

$$ E_0 = mc^2 $$

### Kinetic Energy

$$ K = E - mc^2 = (\\gamma - 1)mc^2 $$

### Relationship between Energy and Momentum

$$ E^2 = (pc)^2 + (mc^2)^2 $$

---

## Mass-Energy Equivalence

$$ E = mc^2 $$

This famous equation shows that mass and energy are interchangeable. A small amount of mass can be converted into a large amount of energy.

---

## Summary

Special relativity revolutionized our understanding of space and time. It shows that time and space are relative, and that mass and energy are equivalent.

# Nuclear Physics

## The Nucleus

The atomic nucleus consists of protons and neutrons (collectively called nucleons).

**Proton:** \\( p = \\text{uud} \\), charge \\( +e \\), mass \\( 1.6726 \\times 10^{-27} \\, \\text{kg} \\)

**Neutron:** \\( n = \\text{udd} \\), charge \\( 0 \\), mass \\( 1.6749 \\times 10^{-27} \\, \\text{kg} \\)

---

## Nuclear Binding Energy

The binding energy is the energy required to separate a nucleus into its constituent nucleons:

$$ E_b = \\Delta m \\, c^2 $$

where \\( \\Delta m \\) is the mass defect.

The binding energy per nucleon is a measure of nuclear stability. It peaks around iron (Fe), indicating that iron is the most stable nucleus.

---

## Radioactivity

Radioactive decay is the spontaneous emission of particles or radiation from an unstable nucleus.

### Types of Decay

| Type | Emitted Particle | Change in A | Change in Z |
|------|------------------|-------------|-------------|
| Alpha (\\( \\alpha \\)) | Helium nucleus (\\( ^4_2\\text{He} \\)) | -4 | -2 |
| Beta (\\( \\beta^- \\)) | Electron | 0 | +1 |
| Beta (\\( \\beta^+ \\)) | Positron | 0 | -1 |
| Gamma (\\( \\gamma \\)) | Photon | 0 | 0 |

---

## Radioactive Decay Law

$$ N(t) = N_0 e^{-\\lambda t} $$

where \\( \\lambda \\) is the decay constant.

### Half-Life

$$ T_{1/2} = \\frac{\\ln 2}{\\lambda} $$

---

## Nuclear Reactions

### Fission

Heavy nuclei split into lighter nuclei, releasing energy:

$$ ^{235}_{92}\\text{U} + ^{1}_{0}\\text{n} \\rightarrow ^{236}_{92}\\text{U} \\rightarrow ^{141}_{56}\\text{Ba} + ^{92}_{36}\\text{Kr} + 3^{1}_{0}\\text{n} + \\text{energy} $$

### Fusion

Light nuclei combine to form heavier nuclei, releasing energy:

$$ ^{2}_{1}\\text{H} + ^{3}_{1}\\text{H} \\rightarrow ^{4}_{2}\\text{He} + ^{1}_{0}\\text{n} + \\text{energy} $$

---

## Summary

Nuclear physics studies the structure and behavior of atomic nuclei. Radioactive decay, nuclear fission, and nuclear fusion are key phenomena that have applications in energy production, medicine, and astrophysics.
